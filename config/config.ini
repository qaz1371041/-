[scraper]
sources = 
    
    https://hk.gh-proxy.org/https://raw.githubusercontent.com/qaz1371041/-IPTV/main/output/live.txt
    http://xiang.hyperphp.com/migu.txt
    https://raw.githubusercontent.com/q1017673817/iptvz/refs/heads/main/zubo.txt
    https://raw.githubusercontent.com/pdd520/iptv-api/master/output/result.txt
    https://raw.githubusercontent.com/fafa002/yf2025/refs/heads/main/yiyifafa.txt
    https://raw.githubusercontent.com/JE668/m3u-checker-max/main/output/live.m3u
    https://raw.githubusercontent.com/yyyr-otz/iptv-api/master/output/user_result.txt
    https://raw.githubusercontent.com/Supprise0901/TVBox_live/refs/heads/main/live.txt
    https://raw.githubusercontent.com/XinMan939/iptv-api/master/output/result.txt
    https://raw.githubusercontent.com/kimwang1978/collect-tv-txt/main/others_output.txt
    # http://202.140.142.145:40207/zhibo/iptv.txt
    https://github.com/alantang1977/cluntop/blob/main/lib/iptv.txt
    https://kakaxi.indevs.in/iptv.txt
    https://live.zbds.top/tv/iptv4.m3u
    
timeout = 15

[speedtest]
threads = 50
bandwidth_threshold = 2
min_resolution_height = 720
timeout = 10
enable_ts_sync_check = true
enable_resolution_detect = true

[output]
output_dir = output
ipv4_enabled = true
ipv6_enabled = true
rtmp_live_enabled = true
rtmp_hls_enabled = true

